server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mismo origen para el frontend y la API: el navegador llama a /api y nginx lo
    # reenvía al contenedor del backend, así que no hace falta CORS.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los archivos generados por Vite llevan hash en el nombre: se pueden cachear sin límite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: las rutas del cliente (p. ej. /solicitudes/13) las resuelve TanStack Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
